<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>韩国地景 - HorizonSimLabs</title>
  <link rel="icon" href="../HorizonSimLabs.png" type="image/png">
  <meta name="color-scheme" content="dark light" />
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/scenery.css">

  <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>
    if (!window.echarts) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>');
    }
  </script>

  <script src="../assets/map-style.js"></script>
</head>
<body class="scenery-page">
  <a href="../scenery.html" id="back-btn" class="hsl-chip">← 返回全球</a>
  <div class="scenery-topright">

    <button id="lang-btn" class="hsl-chip hsl-chip--accent">Switch to English</button>

    <button class="hsl-theme-toggle" data-theme-toggle></button>

  </div>
  
  <div id="map"></div>
  <div id="my-tooltip"></div>

  <script>
    const tooltipEl = document.getElementById('my-tooltip');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);

    // ==================== 地图配色（跟随深色 / 浅色主题） ====================
    function cssVar(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name);
      v = (v || '').trim();
      return v || fallback;
    }

    function mapSeriesStyle(opt) {
      opt = opt || {};
      const c = {
        area: cssVar('--map-area', '#e8ecf1'),
        border: cssVar('--map-border', '#ffffff'),
        label: cssVar('--map-label', '#333'),
        litEdge: cssVar('--map-lit-edge', '#ffffff'),
        hover: cssVar('--map-hover', '#cbd9ef')
      };
      return {
        itemStyle: { areaColor: c.area, borderColor: c.border, borderWidth: 1 },
        emphasis: {
          itemStyle: { areaColor: c.hover, borderColor: c.litEdge, borderWidth: 1.4 },
          label: { show: true, color: c.label }
        },
        label: { show: !!opt.labelShow, fontSize: opt.fontSize || 10, color: c.label }
      };
    }

    let currentLang = 'zh';

    const i18n = {
      zh: {
        back: "← 返回全球", author: "作者：", download: "下载方式：",
        free: "免费版", paid: "付费版", remark: "备注：", noLink: "无", clickDownload: "点击下载", unknown: "未知",
        langBtn: "Switch to English"
      },
      en: {
        back: "← Back to World", author: "Author: ", download: "Download: ",
        free: "Free Version", paid: "Paid Version", remark: "Remark: ", noLink: "None", clickDownload: "Download", unknown: "Unknown",
        langBtn: "切换到中文"
      }
    };

    // ★ 终极对照表：以 GeoJSON/South_Korea.json 里的名称为主键，中英译名齐全
    const krMapDict = {
      'Seoul': { zh: '首尔', en: 'Seoul' },
      'Busan': { zh: '釜山', en: 'Busan' },
      'Daegu': { zh: '大邱', en: 'Daegu' },
      'Incheon': { zh: '仁川', en: 'Incheon' },
      'Gwangju': { zh: '光州', en: 'Gwangju' },
      'Daejeon': { zh: '大田', en: 'Daejeon' },
      'Ulsan': { zh: '蔚山', en: 'Ulsan' },
      'Sejong': { zh: '世宗', en: 'Sejong' },
      'Gyeonggi-do': { zh: '京畿道', en: 'Gyeonggi' },
      'Gangwon-do': { zh: '江原道', en: 'Gangwon' },
      'Chungcheongbuk-do': { zh: '忠清北道', en: 'Chungcheongbuk' },
      'Chungcheongnam-do': { zh: '忠清南道', en: 'Chungcheongnam' },
      'Jeollabuk-do': { zh: '全罗北道', en: 'Jeollabuk' },
      'Jeollanam-do': { zh: '全罗南道', en: 'Jeollanam' },
      'Gyeongsangbuk-do': { zh: '庆尚北道', en: 'Gyeongsangbuk' },
      'Gyeongsangnam-do': { zh: '庆尚南道', en: 'Gyeongsangnam' },
      'Jeju-do': { zh: '济州', en: 'Jeju' },
      // 兼容韩文写法
      '서울특별시': { zh: '首尔', en: 'Seoul' },
      '부산광역시': { zh: '釜山', en: 'Busan' },
      '대구광역시': { zh: '大邱', en: 'Daegu' },
      '인천광역시': { zh: '仁川', en: 'Incheon' },
      '광주광역시': { zh: '光州', en: 'Gwangju' },
      '대전광역시': { zh: '大田', en: 'Daejeon' },
      '울산광역시': { zh: '蔚山', en: 'Ulsan' },
      '세종특별자치시': { zh: '世宗', en: 'Sejong' },
      '경기도': { zh: '京畿道', en: 'Gyeonggi' },
      '강원도': { zh: '江原道', en: 'Gangwon' },
      '충청북도': { zh: '忠清北道', en: 'Chungcheongbuk' },
      '충청남도': { zh: '忠清南道', en: 'Chungcheongnam' },
      '전라북도': { zh: '全罗北道', en: 'Jeollabuk' },
      '전남광역시': { zh: '全罗南道', en: 'Jeollanam' },
      '경상북도': { zh: '庆尚北道', en: 'Gyeongsangbuk' },
      '경상남도': { zh: '庆尚南道', en: 'Gyeongsangnam' },
      '제주특별자치도': { zh: '济州', en: 'Jeju' }
    };

    // 中文 → 中文译名反查（用于把 done.json 里的中文名对到底图名称）
    const krZhToKey = {};
    for (let k in krMapDict) {
      if (!krZhToKey[krMapDict[k].zh]) krZhToKey[krMapDict[k].zh] = k;
    }

    // 翻译地图标签
    function getTranslatedName(rawName) {
      if (krMapDict[rawName]) {
        return currentLang === 'zh' ? krMapDict[rawName].zh : krMapDict[rawName].en;
      }
      return rawName; // 如果实在没匹配到，显示原样
    }

    // 名字脱壳匹配：把底图名 / done.json 名 统一成一个可比较的键
    function cleanKrName(name) {
      if (!name) return '';
      const raw = String(name).trim();

      // 1) 直接命中底图主键
      if (krMapDict[raw]) return raw;

      // 2) 中文译名 → 底图主键（首尔 → Seoul）
      if (krZhToKey[raw]) return krZhToKey[raw];

      // 3) 韩文 / 带后缀的写法
      if (krMapDict[raw.replace(/(特别市|广域市|特别自治市|特别自治道|道|市)$/, '')]) {
        return raw.replace(/(特别市|广域市|特别自治市|特别自治道|道|市)$/, '');
      }

      // 4) 去掉 -do / -si / Prefecture 之类的后缀再比一次
      const stripped = raw.replace(/-(do|si|gu)$/i, '').replace(/\s*Prefecture$/i, '').trim();
      if (krMapDict[stripped]) return stripped;

      // 5) 反向：中文译名包含关系（首尔特别市 → 首尔）
      for (let zh in krZhToKey) {
        if (raw === zh || raw.indexOf(zh) === 0) return krZhToKey[zh];
      }

      return stripped;
    }

    function parseBilingual(text) {
      if (!text) return '';
      const parts = text.split('|');
      if (currentLang === 'zh') return parts[0].trim();
      return (parts[1] || parts[0]).trim();
    }

    function buildHtml(rawProvince, author, freeLink, freeLevel, paidLink, paidLevel, remark) {
      const t = i18n[currentLang];
      
      const displayAuthor = parseBilingual(author);
      const displayFreeLevel = parseBilingual(freeLevel);
      const displayPaidLevel = parseBilingual(paidLevel);
      const displayRemark = parseBilingual(remark);
      
      const parsedFreeLink = parseBilingual(freeLink);
      const parsedPaidLink = parseBilingual(paidLink);

      // 标题翻译
      let titleName = rawProvince;
      for (let krKey in krMapDict) {
        if (krMapDict[krKey].zh === titleName || krKey === titleName) {
          titleName = getTranslatedName(krKey);
          break;
        }
      }

      let html = `<div class="tip-title">${titleName}</div>`;
      html += `<div>${t.author}${displayAuthor || t.unknown}</div>`;
      html += `<div>${t.download}</div>`;
      
      function formatLink(link) {
        if (!link || link === '无' || link === 'None' || link === 'null') {
          return t.noLink;
        }
        const lowerText = link.toLowerCase();
        if (lowerText.startsWith('http://') || lowerText.startsWith('https://')) {
          return `<a class="my-link" href="${link}" target="_blank">${t.clickDownload}</a>`;
        } else {
          return `<span style="color:var(--text-dim); font-weight:bold;">${link}</span>`;
        }
      }

      if (parsedFreeLink || displayFreeLevel) {
        html += `<div style="margin-left:10px;">${t.free}${displayFreeLevel ? ' (' + displayFreeLevel + ')' : ''}: ${formatLink(parsedFreeLink)}</div>`;
      }
      
      if (parsedPaidLink || displayPaidLevel) {
        html += `<div style="margin-left:10px;">${t.paid}${displayPaidLevel ? ' (' + displayPaidLevel + ')' : ''}: ${formatLink(parsedPaidLink)}</div>`;
      }
      
      if (displayRemark) {
        html += `<div class="tip-remark">${t.remark}${displayRemark}</div>`;
      }
      
      return html;
    }

    const myChart = echarts.init(document.getElementById('map'));
    let allParsedData = []; 
    const provinceDataMap = {};

    // ==================== done.json 解析 ====================
    // ★ 必须按「行」解析。
    //   done.json 里很多备注带英文逗号，例如
    //     "...;属华东插件，AF4/AFG|Belongs to the East China plugin,both for AF4 and AFG"
    //   如果用 split(',') 切，这一条会被切成两段，正则再去掉引号和换行后，
    //   相邻两行就会粘在一起，产生不存在的"城市"、并截断备注。
    function parseDoneJson(rawText) {
      const result = [];
      if (!rawText) return result;

      const body = rawText.replace(/^\s*\[/, '').replace(/\]\s*$/, '');

      body.split(/\r?\n/).forEach(line => {
        let l = line.trim();
        if (!l) return;

        // 逐行剥掉 JSON 数组的行尾逗号与首尾引号（不会被正文里的逗号影响）
        l = l.replace(/,\s*$/, '').trim();
        l = l.replace(/^"/, '').replace(/"$/, '').trim();
        if (!l) return;

        l = l.replace(/；/g, ';');   // 兼容中文分号

        const parts = l.split(';');
        const rawProvince = (parts[0] || '').trim();
        if (!rawProvince) return;

        // 备注里可能还有分号，全部并入备注
        const remark = parts.length > 6 ? parts.slice(6).join(';') : (parts[6] || '');

        result.push({
          rawProvince: rawProvince,
          author: parts[1] || i18n[currentLang].unknown,
          freeLink: parts[2] || '', freeLevel: parts[3] || '',
          paidLink: parts[4] || '', paidLevel: parts[5] || '',
          remark: remark
        });
      });

      return result;
    }

    async function fetchData() {
      allParsedData = [];
      const t = i18n[currentLang];

      try {
        let doneRes = await fetch('../done.json?t=' + new Date().getTime());
        
        if (doneRes.ok) {
          // ★ 按行解析，避免备注里的英文逗号把条目切断
          allParsedData = parseDoneJson(await doneRes.text());
        }
      } catch (e) { console.error("读取 done.json 失败", e); }
    }

    // ★ 韩国要的是「省级（道 / 广域市）」分区轮廓，world.json 里韩国只有一整块，
    //   所以优先读取 GeoJSON/South_Korea.json，本地没有再回退到在线分区数据源。
    const KOREA_GEOJSON_URLS = [
      '../GeoJSON/South_Korea.json',
    ];

    async function loadKoreaGeoJson() {
      for (const url of KOREA_GEOJSON_URLS) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.json();
        } catch (e) { console.warn('韩国分区数据读取失败，尝试下一个源：', url); }
      }
      throw new Error('韩国分区地图数据加载失败，请检查 GeoJSON/South_Korea.json。');
    }

    async function renderMap() {
      const t = i18n[currentLang];
      myChart.showLoading();
      
      try {
        // 读取韩国的省级（道 / 广域市）分区轮廓
        const realKrGeoJson = await loadKoreaGeoJson();

        echarts.registerMap('korea', realKrGeoJson);
        
        const features = realKrGeoJson.features.map(f => f.properties.name);
        const mapData = [];
        
        for (let key in provinceDataMap) { delete provinceDataMap[key]; }

        // 逐个省/市匹配 done.json 里的条目
        // ★ 必须用严格相等：以前用 includes 双向包含，短名字会误匹配一大片
        features.forEach(featureName => {
          const cleanFeature = cleanKrName(featureName);

          const items = allParsedData.filter(item => cleanKrName(item.rawProvince) === cleanFeature);

          if (items.length > 0) {
            mapData.push({ name: featureName, itemStyle: HSLGeo.areaStyle('lit') });
            provinceDataMap[featureName] = items
              .map(item => buildHtml(item.rawProvince, item.author, item.freeLink, item.freeLevel, item.paidLink, item.paidLevel, item.remark))
              .join('<hr class="tip-hr" />');
          }
        });

        myChart.hideLoading();

                const style = mapSeriesStyle({ labelShow: true, fontSize: isMobile ? 8 : 10 });


myChart.setOption({
          backgroundColor: 'transparent',
          tooltip: { show: false },
          series: [{
            type: 'map',
            map: 'korea', 
            roam: true,
            zoom: 1.3,
            // ★ 核心修复：地图标签强制翻译
            label: Object.assign({}, style.label, {
              formatter: function (params) {
              return getTranslatedName(params.name);
              }
            }), 
            itemStyle: style.itemStyle,
            selectedMode: false, 
            emphasis: style.emphasis,
            data: mapData
          }]
        }, true);

      } catch (e) {
        console.error("地图加载失败", e);
        myChart.hideLoading();
        const tipEl = document.getElementById('loading-tip');
        if (tipEl) {
          tipEl.style.display = 'block';
          tipEl.innerHTML = '地图数据加载失败，请检查 GeoJSON/South_Korea.json 是否存在。';
          tipEl.classList.add('is-error');
        }
      }
    }

    function updateUI() {
      document.getElementById('lang-btn').innerText = i18n[currentLang].langBtn;
      document.getElementById('back-btn').innerText = i18n[currentLang].back;
    }

    async function initApp() {
      updateUI();
      await fetchData();
      await renderMap();
    }
    // 深浅主题切换后重绘地图（配色取自主题变量）
    if (window.HSLTheme && HSLTheme.onChange) {
      HSLTheme.onChange(() => setTimeout(() => { if (myChart) renderMap(); }, 30));
    }

    initApp();

    document.getElementById('lang-btn').addEventListener('click', async () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateUI();
      await fetchData();
      await renderMap();
    });

    if (!isMobile) {
      let isOverBox = false;
      let hideTimer = null;
      let currentHoverName = null;

      myChart.on('mouseover', function (params) {
        if (!provinceDataMap[params.name]) return;
        if (isOverBox || currentHoverName === params.name) return;
        
        clearTimeout(hideTimer);
        currentHoverName = params.name;
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.transform = 'none';
        tooltipEl.style.bottom = 'auto';
        tooltipEl.style.display = 'block';

        if (params.event && params.event.event) {
          const e = params.event.event;
          let x = e.clientX + 20;
          let y = e.clientY - 20;

          if (x + tooltipEl.offsetWidth > window.innerWidth) x = e.clientX - tooltipEl.offsetWidth - 20;
          if (y + tooltipEl.offsetHeight > window.innerHeight) y = window.innerHeight - tooltipEl.offsetHeight - 10;
          if (y < 10) y = 10;

          tooltipEl.style.left = x + 'px';
          tooltipEl.style.top = y + 'px';
        }
      });

      myChart.on('mouseout', function () {
        hideTimer = setTimeout(() => {
          if (!isOverBox) {
            tooltipEl.style.display = 'none';
            currentHoverName = null;
          }
        }, 300);
      });

      tooltipEl.addEventListener('mouseenter', () => {
        isOverBox = true;
        clearTimeout(hideTimer);
      });

      tooltipEl.addEventListener('mouseleave', () => {
        isOverBox = false;
        tooltipEl.style.display = 'none';
        currentHoverName = null;
      });
    }

    myChart.on('click', function(params) {
      if (isMobile && provinceDataMap[params.name]) {
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.display = 'block';
        tooltipEl.style.left = '50%';
        tooltipEl.style.top = 'auto';
        tooltipEl.style.bottom = '50px';
        tooltipEl.style.transform = 'translateX(-50%)';
      }
    });
    
    myChart.getZr().on('click', function (event) {
      if (isMobile && !event.target) {
        tooltipEl.style.display = 'none';
      }
    });

    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
