<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>朝鲜地景 - HorizonSimLabs</title>
  <link rel="icon" href="../HorizonSimLabs.png" type="image/png">
  <meta name="color-scheme" content="dark light" />
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/scenery.css">

  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script>
    if (!window.echarts) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>');
    }
  </script>

  <script src="../assets/map-style.js"></script>
</head>
<body class="scenery-page">
  <div id="loading-tip">正在加载朝鲜地图...</div>
  <a href="../scenery.html" id="back-btn" class="hsl-chip">← 返回全球</a>
  <div class="scenery-topright">

    <button id="lang-btn" class="hsl-chip hsl-chip--accent">Switch to English</button>

    <button class="hsl-theme-toggle" data-theme-toggle></button>

  </div>
  <div id="map"></div>
  <div id="my-tooltip"></div>

  <script>
    const tooltipEl = document.getElementById('my-tooltip');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);

    // ==================== 地图配色（跟随深色 / 浅色主题） ====================
    function cssVar(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name);
      v = (v || '').trim();
      return v || fallback;
    }

    function mapSeriesStyle(opt) {
      opt = opt || {};
      const c = {
        area: cssVar('--map-area', '#e8ecf1'),
        border: cssVar('--map-border', '#ffffff'),
        label: cssVar('--map-label', '#333'),
        litEdge: cssVar('--map-lit-edge', '#ffffff'),
        hover: cssVar('--map-hover', '#cbd9ef')
      };
      return {
        itemStyle: { areaColor: c.area, borderColor: c.border, borderWidth: 1 },
        emphasis: {
          itemStyle: { areaColor: c.hover, borderColor: c.litEdge, borderWidth: 1.4 },
          label: { show: true, color: c.label }
        },
        label: { show: !!opt.labelShow, fontSize: opt.fontSize || 10, color: c.label }
      };
    }

    let currentLang = 'zh';

    const i18n = {
      zh: { back: "← 返回全球", author: "作者：", download: "下载方式：", free: "免费版", paid: "付费版", remark: "备注：", noLink: "无", clickDownload: "点击下载", unknown: "未知", langBtn: "Switch to English" },
      en: { back: "← Back to World", author: "Author: ", download: "Download: ", free: "Free Version", paid: "Paid Version", remark: "Remark: ", noLink: "None", clickDownload: "Download", unknown: "Unknown", langBtn: "切换到中文" }
    };

    // ★ 以 GeoJSON/North_Korea.json 里的名称为主键
    const kpMapDict = {
      'Pyongyang': { zh: '平壤', en: 'Pyongyang' },
      'North Pyongan': { zh: '平安北道', en: 'North Pyongan' },
      'Pyongannam-do': { zh: '平安南道', en: 'South Pyongan' },
      'Chagang': { zh: '慈江道', en: 'Chagang' },
      'North Hamgyong': { zh: '咸镜北道', en: 'North Hamgyong' },
      'Hamgyongnam-do': { zh: '咸镜南道', en: 'South Hamgyong' },
      'Ryanggang': { zh: '两江道', en: 'Ryanggang' },
      'Hwanghaebuk-do': { zh: '黄海北道', en: 'North Hwanghae' },
      'Hwanghaenam-do': { zh: '黄海南道', en: 'South Hwanghae' },
      'Kangwon-do': { zh: '江原道', en: 'Kangwon' },
      'Kumgang-gun/Kumgangsan Tourist Region': { zh: '金刚山旅游区', en: 'Kumgangsan Tourist Region' }
    };

    // 中文译名 → 底图主键
    const kpZhToKey = {};
    for (let k in kpMapDict) {
      if (!kpZhToKey[kpMapDict[k].zh]) kpZhToKey[kpMapDict[k].zh] = k;
    }

    // 常见别名（城市 / 简称 / 旧写法）
    const kpAlias = {
      '平壤市': 'Pyongyang', '平壤特别市': 'Pyongyang',
      '新义州': 'North Pyongan', '南浦': 'Pyongannam-do', '开城': 'Hwanghaenam-do',
      '元山': 'Kangwon-do', '清津': 'North Hamgyong', '咸兴': 'Hamgyongnam-do',
      '惠山': 'Ryanggang', '价川': 'Pyongannam-do', '罗先': 'North Hamgyong',
      '江界': 'Chagang', '沙里院': 'Hwanghaebuk-do', '海州': 'Hwanghaenam-do',
      '北仓': 'Pyongannam-do', '金刚山': 'Kumgang-gun/Kumgangsan Tourist Region'
    };

    function getTranslatedName(rawName) {
      if (kpMapDict[rawName]) return currentLang === 'zh' ? kpMapDict[rawName].zh : kpMapDict[rawName].en;
      return rawName;
    }

    // 把底图名 / done.json 名 统一成可比较的键
    function cleanKpName(name) {
      if (!name) return '';
      const raw = String(name).trim();

      if (kpMapDict[raw]) return raw;                 // 直接命中底图主键
      if (kpAlias[raw]) return kpAlias[raw];          // 城市别名
      if (kpZhToKey[raw]) return kpZhToKey[raw];      // 中文译名
      if (kpAlias[raw.replace(/(市|道|特别市)$/, '')]) return kpAlias[raw.replace(/(市|道|特别市)$/, '')];
      if (kpZhToKey[raw.replace(/(市|道|特别市)$/, '')]) return kpZhToKey[raw.replace(/(市|道|特别市)$/, '')];

      // 英文常见后缀
      const stripped = raw.replace(/-do$/i, '').replace(/\s*Province$/i, '').trim();
      if (kpMapDict[stripped]) return stripped;

      for (let zh in kpZhToKey) {
        if (raw === zh || raw.indexOf(zh) === 0) return kpZhToKey[zh];
      }
      return stripped;
    }

    function parseBilingual(text) {
      if (!text) return '';
      const parts = text.split('|');
      if (currentLang === 'zh') return parts[0].trim();
      return (parts[1] || parts[0]).trim();
    }

    function buildHtml(rawProvince, author, freeLink, freeLevel, paidLink, paidLevel, remark) {
      const t = i18n[currentLang];
      const displayAuthor = parseBilingual(author);
      const displayFreeLevel = parseBilingual(freeLevel);
      const displayPaidLevel = parseBilingual(paidLevel);
      const displayRemark = parseBilingual(remark);
      const parsedFreeLink = parseBilingual(freeLink);
      const parsedPaidLink = parseBilingual(paidLink);

      const key = cleanKpName(rawProvince);
      const titleName = kpMapDict[key] ? getTranslatedName(key) : rawProvince;

      let html = `<div class="tip-title">${titleName}</div>`;
      if (titleName !== rawProvince) html += `<div class="tip-sub">(${rawProvince})</div>`;
      html += `<div>${t.author}${displayAuthor || t.unknown}</div>`;
      html += `<div>${t.download}</div>`;
      
      function formatLink(link) {
        if (!link || link === '无' || link === 'None' || link === 'null') return t.noLink;
        if (link.toLowerCase().startsWith('http')) return `<a class="my-link" href="${link}" target="_blank">${t.clickDownload}</a>`;
        return `<span style="color:var(--text-dim); font-weight:bold;">${link}</span>`;
      }

      if (parsedFreeLink || displayFreeLevel) html += `<div style="margin-left:10px;">${t.free}${displayFreeLevel ? ' (' + displayFreeLevel + ')' : ''}: ${formatLink(parsedFreeLink)}</div>`;
      if (parsedPaidLink || displayPaidLevel) html += `<div style="margin-left:10px;">${t.paid}${displayPaidLevel ? ' (' + displayPaidLevel + ')' : ''}: ${formatLink(parsedPaidLink)}</div>`;
      if (displayRemark) html += `<div class="tip-remark">${t.remark}${displayRemark}</div>`;
      
      return html;
    }

    const myChart = echarts.init(document.getElementById('map'));
    let allParsedData = [];
    const provinceDataMap = {};

    // ==================== done.json 解析 ====================
    // ★ 必须按「行」解析。
    //   done.json 里很多备注带英文逗号，例如
    //     "...;属华东插件，AF4/AFG|Belongs to the East China plugin,both for AF4 and AFG"
    //   如果用 split(',') 切，这一条会被切成两段，正则再去掉引号和换行后，
    //   相邻两行就会粘在一起，产生不存在的"城市"、并截断备注。
    function parseDoneJson(rawText) {
      const result = [];
      if (!rawText) return result;

      const body = rawText.replace(/^\s*\[/, '').replace(/\]\s*$/, '');

      body.split(/\r?\n/).forEach(line => {
        let l = line.trim();
        if (!l) return;

        // 逐行剥掉 JSON 数组的行尾逗号与首尾引号（不会被正文里的逗号影响）
        l = l.replace(/,\s*$/, '').trim();
        l = l.replace(/^"/, '').replace(/"$/, '').trim();
        if (!l) return;

        l = l.replace(/；/g, ';');   // 兼容中文分号

        const parts = l.split(';');
        const rawProvince = (parts[0] || '').trim();
        if (!rawProvince) return;

        // 备注里可能还有分号，全部并入备注
        const remark = parts.length > 6 ? parts.slice(6).join(';') : (parts[6] || '');

        result.push({
          rawProvince: rawProvince,
          author: parts[1] || i18n[currentLang].unknown,
          freeLink: parts[2] || '', freeLevel: parts[3] || '',
          paidLink: parts[4] || '', paidLevel: parts[5] || '',
          remark: remark
        });
      });

      return result;
    }

    async function fetchData() {
      allParsedData = [];
      const t = i18n[currentLang];
      try {
        let doneRes = await fetch('../done.json?t=' + new Date().getTime());
        if (doneRes.ok) {
          // ★ 按行解析，避免备注里的英文逗号把条目切断
          allParsedData = parseDoneJson(await doneRes.text());
        }
      } catch (e) { console.error("读取 done.json 失败", e); }
    }

    // 朝鲜的一级行政区划（道 / 直辖市 / 特别区）
    const KOREA_GEOJSON_URLS = [
      '../GeoJSON/North_Korea.json',
    ];

    async function loadKoreaGeoJson() {
      for (const url of KOREA_GEOJSON_URLS) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.json();
        } catch (e) { console.warn('朝鲜分区数据读取失败，尝试下一个源：', url); }
      }
      throw new Error('朝鲜分区地图数据加载失败，请检查 GeoJSON/North_Korea.json。');
    }

    async function renderMap() {
      myChart.showLoading();
      try {
        const realGeoJson = await loadKoreaGeoJson();
        echarts.registerMap('northkorea', realGeoJson);

        const features = realGeoJson.features.map(f => f.properties.name);
        const mapData = [];

        for (let key in provinceDataMap) { delete provinceDataMap[key]; }

        // 逐个行政区匹配 done.json 里的条目 —— 必须严格相等，短名字不能误匹配一大片
        features.forEach(featureName => {
          const cleanFeature = cleanKpName(featureName);
          const items = allParsedData.filter(item => cleanKpName(item.rawProvince) === cleanFeature);

          if (items.length > 0) {
            mapData.push({ name: featureName, itemStyle: HSLGeo.areaStyle('lit') });
            provinceDataMap[featureName] = items
              .map(item => buildHtml(item.rawProvince, item.author, item.freeLink, item.freeLevel, item.paidLink, item.paidLevel, item.remark))
              .join('<hr class="tip-hr" />');
          }
        });

        myChart.hideLoading();
        document.getElementById('loading-tip').style.display = 'none';

                const style = mapSeriesStyle({ labelShow: true, fontSize: isMobile ? 8 : 10 });


myChart.setOption({
          backgroundColor: 'transparent',
          tooltip: { show: false },
          series: [{
            type: 'map',
            map: 'northkorea',
            roam: true,
            zoom: 1.4,
            label: Object.assign({}, style.label, {
              formatter: function (params) { return provinceDataMap[params.name] ? getTranslatedName(params.name) : ''; }
            }),
            itemStyle: style.itemStyle,
            selectedMode: false,
            emphasis: style.emphasis,
            data: mapData
          }]
        }, true);

      } catch (e) {
        console.error("地图加载失败", e);
        myChart.hideLoading();
        const tipEl = document.getElementById('loading-tip');
                tipEl.classList.add('is-error');
        tipEl.style.display = 'inline-flex';
        tipEl.innerHTML = '地图数据加载失败，请检查 GeoJSON/North_Korea.json 是否存在。';
      }
    }

    function updateUI() {
      document.getElementById('lang-btn').innerText = i18n[currentLang].langBtn;
      document.getElementById('back-btn').innerText = i18n[currentLang].back;
    }

    async function initApp() { updateUI(); await fetchData(); renderMap(); }
    // 深浅主题切换后重绘地图（配色取自主题变量）
    if (window.HSLTheme && HSLTheme.onChange) {
      HSLTheme.onChange(() => setTimeout(() => { if (myChart) renderMap(); }, 30));
    }
    initApp();

    document.getElementById('lang-btn').addEventListener('click', async () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateUI(); await fetchData(); renderMap();
    });

    if (!isMobile) {
      let isOverBox = false; let hideTimer = null; let currentHoverName = null;
      myChart.on('mouseover', function (params) {
        if (!provinceDataMap[params.name] || isOverBox || currentHoverName === params.name) return;
        clearTimeout(hideTimer); currentHoverName = params.name;
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.transform = 'none'; tooltipEl.style.bottom = 'auto'; tooltipEl.style.display = 'block';
        if (params.event && params.event.event) {
          const e = params.event.event;
          let x = e.clientX + 20; let y = e.clientY - 20;
          if (x + tooltipEl.offsetWidth > window.innerWidth) x = e.clientX - tooltipEl.offsetWidth - 20;
          if (y + tooltipEl.offsetHeight > window.innerHeight) y = window.innerHeight - tooltipEl.offsetHeight - 10;
          if (y < 10) y = 10;
          tooltipEl.style.left = x + 'px'; tooltipEl.style.top = y + 'px';
        }
      });
      myChart.on('mouseout', function () {
        hideTimer = setTimeout(() => { if (!isOverBox) { tooltipEl.style.display = 'none'; currentHoverName = null; } }, 300);
      });
      tooltipEl.addEventListener('mouseenter', () => { isOverBox = true; clearTimeout(hideTimer); });
      tooltipEl.addEventListener('mouseleave', () => { isOverBox = false; tooltipEl.style.display = 'none'; currentHoverName = null; });
    }

    myChart.on('click', function(params) {
      if (isMobile && provinceDataMap[params.name]) {
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.display = 'block'; tooltipEl.style.left = '50%'; tooltipEl.style.top = 'auto';
        tooltipEl.style.bottom = '50px'; tooltipEl.style.transform = 'translateX(-50%)';
      }
    });
    
    myChart.getZr().on('click', function (event) {
      if (isMobile && !event.target) tooltipEl.style.display = 'none';
    });

    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
