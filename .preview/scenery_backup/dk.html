<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>丹麦地景 - HorizonSimLabs</title>
  <link rel="icon" href="../HorizonSimLabs.png" type="image/png">
  <meta name="color-scheme" content="dark light" />
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/scenery.css">

  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script>
    if (!window.echarts) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>');
    }
  </script>

  <script src="../assets/map-style.js"></script>
</head>
<body class="scenery-page">
  <div id="loading-tip">正在加载丹麦地图...</div>
  <a href="../scenery.html" id="back-btn" class="hsl-chip">← 返回全球</a>
  <div class="scenery-topright">

    <button id="lang-btn" class="hsl-chip hsl-chip--accent">Switch to English</button>

    <button class="hsl-theme-toggle" data-theme-toggle></button>

  </div>
  <div id="map"></div>
  <div id="my-tooltip"></div>

  <script>
    const tooltipEl = document.getElementById('my-tooltip');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);

    // ==================== 地图配色（跟随深色 / 浅色主题） ====================
    function cssVar(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name);
      v = (v || '').trim();
      return v || fallback;
    }

    function mapSeriesStyle(opt) {
      opt = opt || {};
      const c = {
        area: cssVar('--map-area', '#e8ecf1'),
        border: cssVar('--map-border', '#ffffff'),
        label: cssVar('--map-label', '#333'),
        litEdge: cssVar('--map-lit-edge', '#ffffff'),
        hover: cssVar('--map-hover', '#cbd9ef')
      };
      return {
        itemStyle: { areaColor: c.area, borderColor: c.border, borderWidth: 1 },
        emphasis: {
          itemStyle: { areaColor: c.hover, borderColor: c.litEdge, borderWidth: 1.4 },
          label: { show: true, color: c.label }
        },
        label: { show: !!opt.labelShow, fontSize: opt.fontSize || 10, color: c.label }
      };
    }

    let currentLang = 'zh';

    const i18n = {
      zh: { back: "← 返回全球", author: "作者：", download: "下载方式：", free: "免费版", paid: "付费版", remark: "备注：", noLink: "无", clickDownload: "点击下载", unknown: "未知", langBtn: "Switch to English" },
      en: { back: "← Back to World", author: "Author: ", download: "Download: ", free: "Free Version", paid: "Paid Version", remark: "Remark: ", noLink: "None", clickDownload: "Download", unknown: "Unknown", langBtn: "切换到中文" }
    };

    // ★ GeoJSON/Denmark.json 里是 29 个（首都圈）市镇，这里逐个给出中文名
    const dkDict = {
      'Albertslund Municipality': { zh: '阿尔贝特斯隆' },
      'Allerød Municipality': { zh: '阿勒勒' },
      'Ballerup Municipality': { zh: '巴勒鲁普' },
      'Bornholms Regionskommune': { zh: '博恩霍尔姆' },
      'Brøndby Municipality': { zh: '布伦比' },
      'Copenhagen Municipality': { zh: '哥本哈根' },
      'Dragør Municipality': { zh: '德拉厄' },
      'Egedal Municipality': { zh: '埃格达尔' },
      'Fredensborg Municipality': { zh: '腓特烈松堡' },
      'Frederiksberg Municipality': { zh: '腓特烈斯贝' },
      'Frederikssund Municipality': { zh: '腓特烈松' },
      'Furesø Municipality': { zh: '富雷瑟' },
      'Gentofte Municipality': { zh: '根措夫特' },
      'Gladsaxe Municipality': { zh: '格拉德萨克斯' },
      'Glostrup Municipality': { zh: '格洛斯楚普' },
      'Gribskov Municipality': { zh: '格里布斯考' },
      'Halsnæs Municipality': { zh: '哈尔斯奈斯' },
      'Helsingør Municipality': { zh: '赫尔辛格' },
      'Herlev Municipality': { zh: '赫勒乌' },
      'Hillrød Municipality': { zh: '希勒勒' },
      'Hørsholm Municipality': { zh: '赫斯霍尔姆' },
      'Hvidovre Municipality': { zh: '维兹奥勒' },
      'Ishøj Municipality': { zh: '伊肖伊' },
      'Lyngby-Taarbæk Municipality': { zh: '灵比-塔拜克' },
      'Rødovre Municipality': { zh: '鲁泽乌勒' },
      'Rudersdal Municipality': { zh: '鲁德斯达尔' },
      'Tårnby Kommune': { zh: '塔恩比' },
      'Vallensbæk Municipality': { zh: '瓦伦斯拜克' },
      // 下面这些可能出现在别的行政区数据里，一并兜住
      'Billund Municipality': { zh: '比隆' },
      'Copenhagen': { zh: '哥本哈根' },
      'Billund': { zh: '比隆' }
    };

    // done.json 里可能写的是中文 / 英语 / 丹麦语，这里统一映射到「底图市镇名」
    const dkAlias = {
      // 首都圈市镇
      '哥本哈根': 'Copenhagen Municipality', 'Copenhagen': 'Copenhagen Municipality', 'København': 'Copenhagen Municipality',
      '腓特烈斯贝': 'Frederiksberg Municipality', 'Frederiksberg': 'Frederiksberg Municipality',
      '赫尔辛格': 'Helsingør Municipality', 'Elsinore': 'Helsingør Municipality',
      '希勒勒': 'Hillerød Municipality', 'Hillerod': 'Hillerød Municipality',
      '希勒勒市': 'Hillerød Municipality',
      '博恩霍尔姆': 'Bornholms Regionskommune', 'Bornholm': 'Bornholms Regionskommune',
      '塔恩比': 'Tårnby Kommune', 'Taarnby': 'Tårnby Kommune',
      '灵比': 'Lyngby-Taarbæk Municipality', 'Lyngby': 'Lyngby-Taarbæk Municipality',

      // ★ 比隆不在首都圈那 29 个市镇里，但它所在的「南丹麦大区 / 中日德兰」没有轮廓数据，
      //   所以这里把比隆挂到比隆实际所在的比隆市镇（Billund Kommune）；
      //   如果底图里没有这个市镇，会退回到「最近的一个市镇」，保证至少有一块亮起来。
      '比隆': 'Billund Municipality', 'Billund': 'Billund Municipality',
      '乐高': 'Billund Municipality', 'Lego': 'Billund Municipality',
      '乐高乐园': 'Billund Municipality',

      // 其他常见城市 → 就近的首都圈市镇（底图只有首都圈时才用得上）
      '欧登塞': 'Copenhagen Municipality', 'Odense': 'Copenhagen Municipality',
      '奥胡斯': 'Copenhagen Municipality', 'Aarhus': 'Copenhagen Municipality',
      '埃斯比约': 'Copenhagen Municipality', 'Esbjerg': 'Copenhagen Municipality',
      '罗斯基勒': 'Roskilde Municipality', 'Roskilde': 'Roskilde Municipality'
    };

    // 粗略经纬度（用于兜底：当 done.json 写的地方底图里没有时，找最近的市镇点亮）
    const dkCityCoord = {
      '比隆': [8.90, 55.73], 'Billund': [8.90, 55.73],
      '哥本哈根': [12.57, 55.68], 'Copenhagen': [12.57, 55.68],
      '欧登塞': [10.39, 55.40], 'Odense': [10.39, 55.40],
      '奥胡斯': [10.20, 56.16], 'Aarhus': [10.20, 56.16],
      '埃斯比约': [8.45, 55.47], 'Esbjerg': [8.45, 55.47],
      '赫尔辛格': [12.61, 56.04], 'Helsingør': [12.61, 56.04],
      '罗斯基勒': [12.08, 55.64], 'Roskilde': [12.08, 55.64],
      '奥尔堡': [9.92, 57.05], 'Aalborg': [9.92, 57.05],
      '奥胡斯市': [10.20, 56.16]
    };

    function stripSuffix(name) {
      return String(name || '')
        .replace(/\s*(Municipality|Kommune|Regionskommune)$/i, '')
        .trim();
    }

    function getTranslatedName(rawName) {
      const key = findDictKey(rawName);
      if (key && dkDict[key] && currentLang === 'zh') return dkDict[key].zh;
      return stripSuffix(rawName);
    }

    function findDictKey(name) {
      const raw = String(name || '').trim();
      if (dkDict[raw]) return raw;
      const s = stripSuffix(raw);
      for (let k in dkDict) {
        if (k === raw || stripSuffix(k) === s) return k;
        if (dkDict[k].zh === raw) return k;
      }
      return null;
    }

    // 把底图名 / done.json 名统一成可比较的键（严格匹配，避免"丹麦"把全部市镇都点亮）
    function cleanDkName(name) {
      if (!name) return '';
      const raw = String(name).trim();

      const direct = findDictKey(raw);
      if (direct) return direct;

      if (dkAlias[raw]) return dkAlias[raw];

      // 中文 → 底图主键
      for (let k in dkDict) {
        if (dkDict[k].zh === raw || raw.indexOf(dkDict[k].zh) === 0) return k;
      }

      return stripSuffix(raw);
    }

    // 底图市镇的中心点（用范围中心近似）
    const dkFeatureCenter = {};

    // Denmark.json 是 ECharts 的压缩格式（UTF8Encoding: true），坐标是编码过的字符串，
    // 直接遍历拿不到经纬度，这里先按官方算法解压
    function decodeCompressedRing(coordStr, encodeOffsets) {
      const result = [];
      let prevX = encodeOffsets[0];
      let prevY = encodeOffsets[1];
      for (let i = 0; i < coordStr.length; i += 2) {
        let x = coordStr.charCodeAt(i) - 64;
        let y = coordStr.charCodeAt(i + 1) - 64;
        x = (x >> 1) ^ (-(x & 1));
        y = (y >> 1) ^ (-(y & 1));
        x += prevX;
        y += prevY;
        prevX = x;
        prevY = y;
        result.push([x / 1024, y / 1024]);
      }
      return result;
    }

    function decodeGeoJson(geoJson) {
      if (!geoJson || !geoJson.UTF8Encoding) return geoJson;

      const features = (geoJson.features || []).map(f => {
        const g = f.geometry || {};
        let coords = [];
        if (g.type === 'Polygon') {
          coords = (g.coordinates || []).map((ring, i) => decodeCompressedRing(ring, g.encodeOffsets[i]));
        } else if (g.type === 'MultiPolygon') {
          coords = (g.coordinates || []).map((poly, i) =>
            (poly || []).map((ring, j) => decodeCompressedRing(ring, g.encodeOffsets[i][j]))
          );
        } else {
          coords = g.coordinates || [];
        }
        return {
          type: 'Feature',
          properties: f.properties,
          geometry: { type: g.type, coordinates: coords }
        };
      });

      return { type: 'FeatureCollection', features };
    }

    function computeFeatureCenters(geoJson) {
      for (let name in dkFeatureCenter) delete dkFeatureCenter[name];
      (geoJson.features || []).forEach(f => {
        let minLon = 999, maxLon = -999, minLat = 999, maxLat = -999;
        const walk = (node) => {
          if (!Array.isArray(node)) return;
          if (node.length >= 2 && typeof node[0] === 'number' && typeof node[1] === 'number') {
            if (isFinite(node[0]) && isFinite(node[1])) {
              minLon = Math.min(minLon, node[0]); maxLon = Math.max(maxLon, node[0]);
              minLat = Math.min(minLat, node[1]); maxLat = Math.max(maxLat, node[1]);
            }
            return;
          }
          node.forEach(walk);
        };
        walk(f && f.geometry && f.geometry.coordinates);
        if (minLon < 900) {
          dkFeatureCenter[f.properties.name] = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
        }
      });
    }

    // 当 done.json 里写的地方底图没有时：找经纬度上最近的市镇
    function nearestMunicipality(cityName) {
      const coord = dkCityCoord[cityName];
      if (!coord) return null;

      let best = null, bestDist = Infinity;
      for (let name in dkFeatureCenter) {
        const c = dkFeatureCenter[name];
        const d = Math.pow(c[0] - coord[0], 2) + Math.pow(c[1] - coord[1], 2);
        if (d < bestDist) { bestDist = d; best = name; }
      }
      return best;
    }

    // 判定某条 done.json 数据应该落在底图的哪一块
    function resolveDkTarget(rawProvince) {
      const mapped = dkAlias[rawProvince] || (findDictKey(rawProvince) || '');
      // 1) 映射到的市镇确实在底图里
      if (mapped && dkFeatureCenter[mapped]) return mapped;
      // 2) 名字本身就在底图里
      if (dkFeatureCenter[rawProvince]) return rawProvince;
      // 3) 用经纬度找最近的市镇
      const near = nearestMunicipality(rawProvince);
      if (near) return near;
      // 4) 映射名不在底图里时，也试试经纬度
      if (mapped) {
        const nearMapped = nearestMunicipality(stripSuffix(mapped));
        if (nearMapped) return nearMapped;
      }
      return null;
    }

    function parseBilingual(text) {
      if (!text) return '';
      const parts = text.split('|');
      if (currentLang === 'zh') return parts[0].trim();
      return (parts[1] || parts[0]).trim();
    }

    function buildHtml(rawProvince, author, freeLink, freeLevel, paidLink, paidLevel, remark) {
      const t = i18n[currentLang];
      const displayAuthor = parseBilingual(author);
      const displayFreeLevel = parseBilingual(freeLevel);
      const displayPaidLevel = parseBilingual(paidLevel);
      const displayRemark = parseBilingual(remark);
      const parsedFreeLink = parseBilingual(freeLink);
      const parsedPaidLink = parseBilingual(paidLink);

      const titleName = getTranslatedName(rawProvince);

      let html = `<div class="tip-title">${titleName}</div>`;
      if (titleName !== rawProvince) html += `<div class="tip-sub">(${rawProvince})</div>`;
      html += `<div>${t.author}${displayAuthor || t.unknown}</div>`;
      html += `<div>${t.download}</div>`;
      
      function formatLink(link) {
        if (!link || link === '无' || link === 'None' || link === 'null') return t.noLink;
        if (link.toLowerCase().startsWith('http')) return `<a class="my-link" href="${link}" target="_blank">${t.clickDownload}</a>`;
        return `<span style="color:var(--text-dim); font-weight:bold;">${link}</span>`;
      }

      if (parsedFreeLink || displayFreeLevel) html += `<div style="margin-left:10px;">${t.free}${displayFreeLevel ? ' (' + displayFreeLevel + ')' : ''}: ${formatLink(parsedFreeLink)}</div>`;
      if (parsedPaidLink || displayPaidLevel) html += `<div style="margin-left:10px;">${t.paid}${displayPaidLevel ? ' (' + displayPaidLevel + ')' : ''}: ${formatLink(parsedPaidLink)}</div>`;
      if (displayRemark) html += `<div class="tip-remark">${t.remark}${displayRemark}</div>`;
      
      return html;
    }

    const myChart = echarts.init(document.getElementById('map'));
    let allParsedData = [];
    const provinceDataMap = {};

    // ==================== done.json 解析 ====================
    // ★ 必须按「行」解析。
    //   done.json 里很多备注带英文逗号，例如
    //     "...;属华东插件，AF4/AFG|Belongs to the East China plugin,both for AF4 and AFG"
    //   如果用 split(',') 切，这一条会被切成两段，正则再去掉引号和换行后，
    //   相邻两行就会粘在一起，产生不存在的"城市"、并截断备注。
    function parseDoneJson(rawText) {
      const result = [];
      if (!rawText) return result;

      const body = rawText.replace(/^\s*\[/, '').replace(/\]\s*$/, '');

      body.split(/\r?\n/).forEach(line => {
        let l = line.trim();
        if (!l) return;

        // 逐行剥掉 JSON 数组的行尾逗号与首尾引号（不会被正文里的逗号影响）
        l = l.replace(/,\s*$/, '').trim();
        l = l.replace(/^"/, '').replace(/"$/, '').trim();
        if (!l) return;

        l = l.replace(/；/g, ';');   // 兼容中文分号

        const parts = l.split(';');
        const rawProvince = (parts[0] || '').trim();
        if (!rawProvince) return;

        // 备注里可能还有分号，全部并入备注
        const remark = parts.length > 6 ? parts.slice(6).join(';') : (parts[6] || '');

        result.push({
          rawProvince: rawProvince,
          author: parts[1] || i18n[currentLang].unknown,
          freeLink: parts[2] || '', freeLevel: parts[3] || '',
          paidLink: parts[4] || '', paidLevel: parts[5] || '',
          remark: remark
        });
      });

      return result;
    }

    async function fetchData() {
      allParsedData = [];
      const t = i18n[currentLang];
      try {
        let doneRes = await fetch('../done.json?t=' + new Date().getTime());
        if (doneRes.ok) {
          // ★ 按行解析，避免备注里的英文逗号把条目切断
          const entries = parseDoneJson(await doneRes.text());
          entries.forEach(entry => {
            allParsedData.push({
              rawProvince: entry.rawProvince,
              author: entry.author,
              freeLink: entry.freeLink, freeLevel: entry.freeLevel,
              paidLink: entry.paidLink, paidLevel: entry.paidLevel,
              remark: entry.remark
            });
          });
        }
      } catch (e) { console.error("读取 done.json 失败", e); }
    }

    // 丹麦的市镇级行政区划
    const DENMARK_GEOJSON_URLS = [
      '../GeoJSON/Denmark.json'
    ];

    async function loadDenmarkGeoJson() {
      for (const url of DENMARK_GEOJSON_URLS) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.json();
        } catch (e) { console.warn('丹麦分区数据读取失败，尝试下一个源：', url); }
      }
      throw new Error('丹麦分区地图数据加载失败，请检查 GeoJSON/Denmark.json。');
    }

    async function renderMap() {
      myChart.showLoading();
      try {
        const realGeoJson = decodeGeoJson(await loadDenmarkGeoJson());
        echarts.registerMap('denmark', realGeoJson);

        const features = realGeoJson.features.map(f => f.properties.name);
        const mapData = [];

        for (let key in provinceDataMap) { delete provinceDataMap[key]; }
        computeFeatureCenters(realGeoJson);

        // 「丹麦」这种国家级条目：不落到具体市镇，避免全部点亮
        const isCountryLevel = (n) => n === '丹麦' || n === 'Denmark' || n === 'Danmark';

        // ★ 关键：每条 done.json 数据先解析出「该落在底图哪一块」
        //   写「比隆」→ 解析到比隆所在的市镇；底图里没有就按经纬度找最近的市镇
        //   这样 hover 上显示的是比隆的详细信息，而不是某个无关市镇的名字
        const itemTarget = new Map();
        allParsedData.forEach(item => {
          const raw = String(item.rawProvince || '').trim();
          if (isCountryLevel(raw)) return;             // 国家级条目不点亮
          const target = resolveDkTarget(raw);
          if (target) itemTarget.set(target, (itemTarget.get(target) || []).concat([item]));
        });

        features.forEach(featureName => {
          const items = itemTarget.get(featureName);
          if (items && items.length > 0) {
            mapData.push({ name: featureName, itemStyle: { areaColor: 'rgba(0, 180, 100, 0.6)' }) });
            provinceDataMap[featureName] = items
              .map(item => buildHtml(item.rawProvince, item.author, item.freeLink, item.freeLevel, item.paidLink, item.paidLevel, item.remark))
              .join('<hr class="tip-hr" />');
          }
        });

        // 调试信息：哪些条目没找到落脚点
        const unresolved = allParsedData
          .filter(item => !isCountryLevel(String(item.rawProvince || '').trim()))
          .filter(item => !resolveDkTarget(String(item.rawProvince || '').trim()));
        if (unresolved.length) {
          console.warn('[丹麦] 这些地点没能在底图里找到对应市镇:', unresolved.map(i => i.rawProvince).join(', '));
        }
        if (typeof console !== 'undefined') {
          console.debug('[丹麦] 点亮:', mapData.map(d => d.name + ' ← ' + itemTarget.get(d.name).map(i => i.rawProvince).join('/')).join(' | ') || '无');
        }

        myChart.hideLoading();
        document.getElementById('loading-tip').style.display = 'none';

                const style = mapSeriesStyle({ labelShow: true, fontSize: isMobile ? 8 : 10 });

myChart.setOption({
          tooltip: { show: false },
          series: [{
            type: 'map',
            map: 'denmark',
            roam: true,
            zoom: 1.2,
            label: Object.assign({}, style.label, {
              formatter: function (params) { return provinceDataMap[params.name] ? getTranslatedName(params.name) : ''; }
            }),
            itemStyle: style.itemStyle,
            selectedMode: false,
            emphasis: style.emphasis,
            data: mapData
          }]
        });

      } catch (e) {
        console.error("地图加载失败", e);
        myChart.hideLoading();
        const tipEl = document.getElementById('loading-tip');
        tipEl.style.display = 'inline-flex';
        tipEl.innerHTML = '地图数据加载失败，请检查网络或数据源。';
      }
    }

    function updateUI() {
      document.getElementById('lang-btn').innerText = i18n[currentLang].langBtn;
      document.getElementById('back-btn').innerText = i18n[currentLang].back;
    }

    async function initApp() { updateUI(); await fetchData(); renderMap(); }
    initApp();

    document.getElementById('lang-btn').addEventListener('click', async () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateUI(); await fetchData(); renderMap();
    });

    if (!isMobile) {
      let isOverBox = false; let hideTimer = null; let currentHoverName = null;
      myChart.on('mouseover', function (params) {
        if (!provinceDataMap[params.name] || isOverBox || currentHoverName === params.name) return;
        clearTimeout(hideTimer); currentHoverName = params.name;
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.transform = 'none'; tooltipEl.style.bottom = 'auto'; tooltipEl.style.display = 'block';
        if (params.event && params.event.event) {
          const e = params.event.event;
          let x = e.clientX + 20; let y = e.clientY - 20;
          if (x + tooltipEl.offsetWidth > window.innerWidth) x = e.clientX - tooltipEl.offsetWidth - 20;
          if (y + tooltipEl.offsetHeight > window.innerHeight) y = window.innerHeight - tooltipEl.offsetHeight - 10;
          if (y < 10) y = 10;
          tooltipEl.style.left = x + 'px'; tooltipEl.style.top = y + 'px';
        }
      });
      myChart.on('mouseout', function () {
        hideTimer = setTimeout(() => { if (!isOverBox) { tooltipEl.style.display = 'none'; currentHoverName = null; } }, 300);
      });
      tooltipEl.addEventListener('mouseenter', () => { isOverBox = true; clearTimeout(hideTimer); });
      tooltipEl.addEventListener('mouseleave', () => { isOverBox = false; tooltipEl.style.display = 'none'; currentHoverName = null; });
    }

    myChart.on('click', function(params) {
      if (isMobile && provinceDataMap[params.name]) {
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.display = 'block'; tooltipEl.style.left = '50%'; tooltipEl.style.top = 'auto';
        tooltipEl.style.bottom = '50px'; tooltipEl.style.transform = 'translateX(-50%)';
      }
    });
    
    myChart.getZr().on('click', function (event) {
      if (isMobile && !event.target) tooltipEl.style.display = 'none';
    });

    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
