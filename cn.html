    let allParsedData = [];

    function getTranslatedName(rawName) {
      if (currentLang === 'zh') return rawName;

      let clean = rawName
        .replace(/(省|市|自治区|特别行政区|自治州|地区|盟|县|区|土家族|苗族|藏族|羌族|彝族|傣族|白族|哈尼族|壮族|回族|蒙古族|朝鲜族|哈萨克|柯尔克孜|自治|族)/g, '')
        .trim();

      if (nameTranslation[clean]) return nameTranslation[clean];
      if (nameTranslation[rawName]) return nameTranslation[rawName];
      
      for (let key in nameTranslation) {
        if (clean.includes(key) || key.includes(clean)) {
          return nameTranslation[key];
        }
      }
      
      return clean;
    }

    function parseBilingual(text) {
      if (!text) return '';
      const parts = text.split('|');
      if (currentLang === 'zh') return parts[0].trim();
      return (parts[1] || parts[0]).trim();
    }

    function buildHtml(rawProvince, author, freeLink, freeLevel, paidLink, paidLevel, remark) {
      const t = i18n[currentLang];
      
      const displayAuthor = parseBilingual(author);
      const displayFreeLevel = parseBilingual(freeLevel);
      const displayPaidLevel = parseBilingual(paidLevel);
      const displayRemark = parseBilingual(remark);
      
      const parsedFreeLink = parseBilingual(freeLink);
      const parsedPaidLink = parseBilingual(paidLink);

      const titleName = getTranslatedName(rawProvince);

      let html = `<div style="font-weight:bold;font-size:15px;margin-bottom:5px;">【${titleName}】</div>`;
      html += `<div>${t.author}${displayAuthor || t.unknown}</div>`;
      html += `<div>${t.download}</div>`;
      
      function formatLink(link) {
        if (!link || link === '无' || link === 'None' || link === 'null') {
          return t.noLink;
        }
        const lowerText = link.toLowerCase();
        if (lowerText.startsWith('http://') || lowerText.startsWith('https://')) {
          return `<a class="my-link" href="${link}" target="_blank">${t.clickDownload}</a>`;
        } else {
          return `<span style="color:#333; font-weight:bold;">${link}</span>`;
        }
      }

      if (parsedFreeLink || displayFreeLevel) {
        html += `<div style="margin-left:10px;">${t.free}${displayFreeLevel ? ' (' + displayFreeLevel + ')' : ''}: ${formatLink(parsedFreeLink)}</div>`;
      }
      
      if (parsedPaidLink || displayPaidLevel) {
        html += `<div style="margin-left:10px;">${t.paid}${displayPaidLevel ? ' (' + displayPaidLevel + ')' : ''}: ${formatLink(parsedPaidLink)}</div>`;
      }
      
      if (displayRemark) {
        html += `<div style="margin-top:8px; padding-top:8px; border-top:1px dashed #ccc; color:#666; font-size:12px; white-space:normal; max-width:300px;">${t.remark}${displayRemark}</div>`;
      }
      
      return html;
    }

    const myChart = echarts.init(document.getElementById('map'));

    async function fetchData() {
      allParsedData = [];
      allowedDrillProvinces.clear();
      const t = i18n[currentLang];

      try {
        // ★ 核心修改：现在直接读取根目录的 done.json
        let doneRes = await fetch('./done.json?t=' + new Date().getTime());
        
        if (doneRes.ok) {
          let text = await doneRes.text();
          text = text.replace(/[\[\]"'\r\n]/g, '').trim(); 
          const lines = text.split(',');

          lines.forEach(line => {
            let rawLine = line.trim();
            if (!rawLine) return;
            rawLine = rawLine.replace(/；/g, ';'); 
            const parts = rawLine.split(';'); 
            
            const rawProvince = parts[0].trim();
            const itemData = {
              rawProvince: rawProvince,
              author: parts[1] || t.unknown,
              freeLink: parts[2] || '',
              freeLevel: parts[3] || '',
              paidLink: parts[4] || '',
              paidLevel: parts[5] || '',
              remark: parts[6] || ''
            };

            const cleanName = rawProvince.replace(/(市|自治州|地区|盟|县|区)$/, '');
            
            if (superCityMap[cleanName]) {
              itemData.provinceName = superCityMap[cleanName];
              allowedDrillProvinces.add(itemData.provinceName);
            } else {
              itemData.provinceName = rawProvince;
            }
            allParsedData.push(itemData);
          });
        }
      } catch (e) { console.error("读取数据失败", e); }
    }

    async function renderMap(mapId = null, isProvince = false) {
      const t = i18n[currentLang];
      currentMapId = mapId;
      myChart.showLoading();
      
      try {
        const url = mapId 
          ? `https://geo.datav.aliyun.com/areas_v3/bound/${mapId}_full.json`
          : 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';
        
        const res = await fetch(url);
        const geoJson = await res.json();
        
        const currentMapName = mapId ? `map_${mapId}` : 'china';
        echarts.registerMap(currentMapName, geoJson);
        
        const features = geoJson.features.map(f => f.properties.name);
        const mapData = [];
        
        for (let key in provinceDataMap) { delete provinceDataMap[key]; }

        const completedProvincesShort = allParsedData
          .map(item => provinceShortMap[item.rawProvince] || item.rawProvince)
          .filter(shortName => shortName !== undefined);

        features.forEach(featureName => {
          const featureShort = provinceShortMap[featureName] || featureName.replace(/(省|市|自治区|特别行政区)/g, '');
          
          if (!isProvince) {
            if (completedProvincesShort.includes(featureShort) || completedProvincesShort.includes(featureName)) {
              mapData.push({ name: featureName, itemStyle: { areaColor: 'rgba(0, 180, 100, 0.6)' } });
              const matchItem = allParsedData.find(item => item.rawProvince === featureShort || item.rawProvince === featureName);
              if (matchItem) {
                provinceDataMap[featureName] = buildHtml(matchItem.rawProvince, matchItem.author, matchItem.freeLink, matchItem.freeLevel, matchItem.paidLink, matchItem.paidLevel, matchItem.remark);
              }
            } else {
              const hasCityCompleted = allParsedData.some(item => {
                if (provinceShortMap[item.rawProvince] || provinceCodeMap[item.rawProvince]) return false;
                const cleanName = item.rawProvince.replace(/(市|自治州|地区|盟|县|区)$/, '');
                const prov = superCityMap[cleanName];
                if (prov) {
                  const provShort = provinceShortMap[prov] || prov.replace(/(省|市|自治区)/g, '');
                  return provShort === featureShort;
                }
                return false;
              });

              if (hasCityCompleted) {
                mapData.push({ name: featureName, itemStyle: { areaColor: 'rgba(255, 190, 0, 0.6)' } });
              }
            }
          } else {
            const matchItem = allParsedData.find(item => {
              const itemRaw = item.rawProvince;
              const fRaw = featureName;
              if (fRaw.includes('恩施') && itemRaw.includes('恩施')) return true;
              const itemClean = itemRaw.replace(/(市|自治州|地区|盟|县|区)$/, '');
              const fClean = fRaw.replace(/(市|自治州|地区|盟|县|区)$/, '');
              return itemClean === fClean || itemClean.includes(fClean) || fClean.includes(itemClean);
            });
            
            if (matchItem) {
              mapData.push({ name: featureName, itemStyle: { areaColor: 'rgba(0, 180, 100, 0.6)' } });
              provinceDataMap[featureName] = buildHtml(matchItem.rawProvince, matchItem.author, matchItem.freeLink, matchItem.freeLevel, matchItem.paidLink, matchItem.paidLevel, matchItem.remark);
            }
          }
        });

        myChart.hideLoading();
        myChart.setOption({
          tooltip: { show: false },
          series: [{
            type: 'map',
            map: currentMapName, 
            roam: true,
            zoom: isProvince ? 1.1 : (isMobile ? 1.2 : 1.5),
            center: isProvince ? undefined : [104, 36],
            label: { 
              show: true, 
              fontSize: isMobile ? 7 : 10, 
              color: '#333',
              formatter: function (params) {
                return getTranslatedName(params.name);
              }
            }, 
            itemStyle: { areaColor: '#e8ecf1', borderColor: '#ffffff', borderWidth: 1 },
            selectedMode: false, 
            emphasis: { itemStyle: { areaColor: 'inherit' } },
            data: mapData
          }]
        });

        backBtn.style.display = isProvince ? 'block' : 'none';
        backBtn.innerText = isProvince ? t.back : t.backList; 
        backBtn.onclick = isProvince ? () => renderMap(null, false) : () => window.location.href = './scenery.html';

      } catch (e) {
        console.error("地图加载失败", e);
        myChart.hideLoading();
      }
    }

      document.getElementById('lang-btn').innerText = i18n[currentLang].langBtn;
      backBtn.innerText = i18n[currentLang].backList;
    }

    async function initApp() {
      updateUI();
      await fetchData();
      await renderMap(null, false);

    document.getElementById('lang-btn').addEventListener('click', async () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateUI();
      await fetchData();
      await renderMap(currentMapId, currentMapId !== null);
    });

    let lastClickTime = 0;
    let lastClickName = '';

    myChart.on('click', function (params) {
      const now = new Date().getTime();
      const provinceName = params.name;
      
      const cleanProvName = (provinceShortMap[provinceName] || provinceName.replace(/(省|市|自治区|特别行政区)/g, '')).trim();
      let canDrill = false;
      
      for (let prov of allowedDrillProvinces) {
        const pShort = (provinceShortMap[prov] || prov.replace(/(省|市|自治区)/g, '')).trim();
        if (pShort === cleanProvName) {
          canDrill = true;
          break;
        }
      }

      if (isMobile) {
        if (now - lastClickTime < 300 && lastClickName === provinceName) {
          if (canDrill && backBtn.style.display === 'none') {
             let mapId = null;
             for (let key in provinceCodeMap) {
               const shortKey = (provinceShortMap[key] || key.replace(/(省|市|自治区)/g, '')).trim();
               if (shortKey === cleanProvName) {
                  mapId = provinceCodeMap[key];
                  break;
               }
             }
             if (mapId) {
               tooltipEl.style.display = 'none';
               renderMap(mapId, true);
             }
          }
        } else {
          if (provinceDataMap[provinceName]) {
            tooltipEl.innerHTML = provinceDataMap[provinceName];
            tooltipEl.style.display = 'block';
            tooltipEl.style.left = '50%';
            tooltipEl.style.top = 'auto';
            tooltipEl.style.bottom = '50px';
            tooltipEl.style.transform = 'translateX(-50%)';
          } else {
            tooltipEl.style.display = 'none';
          }
        }
        lastClickTime = now;
        lastClickName = provinceName;
      } else {
        if (canDrill && backBtn.style.display === 'none') {
          let mapId = null;
          for (let key in provinceCodeMap) {
            const shortKey = (provinceShortMap[key] || key.replace(/(省|市|自治区)/g, '')).trim();
            if (shortKey === cleanProvName) {
               mapId = provinceCodeMap[key];
               break;
            }
          }
          if (mapId) {
            renderMap(mapId, true);
          }
        }
      }
    });

    myChart.getZr().on('click', function (event) {
      if (isMobile && !event.target) {
        tooltipEl.style.display = 'none';
      }
    });

    if (!isMobile) {
      let isOverBox = false;
      let hideTimer = null;
      let currentHoverName = null;

      myChart.on('mouseover', function (params) {
        if (!provinceDataMap[params.name]) return;
        if (isOverBox || currentHoverName === params.name) return;
        
        clearTimeout(hideTimer);
        currentHoverName = params.name;
        tooltipEl.innerHTML = provinceDataMap[params.name];
        tooltipEl.style.transform = 'none';
        tooltipEl.style.bottom = 'auto';
        tooltipEl.style.display = 'block';

        if (params.event && params.event.event) {
          const e = params.event.event;
          let x = e.clientX + 20;
          let y = e.clientY - 20;

          if (x + tooltipEl.offsetWidth > window.innerWidth) x = e.clientX - tooltipEl.offsetWidth - 20;
          if (y + tooltipEl.offsetHeight > window.innerHeight) y = window.innerHeight - tooltipEl.offsetHeight - 10;
          if (y < 10) y = 10;

          tooltipEl.style.left = x + 'px';
          tooltipEl.style.top = y + 'px';
        }
      });

      myChart.on('mouseout', function () {
        hideTimer = setTimeout(() => {
          if (!isOverBox) {
            tooltipEl.style.display = 'none';
            currentHoverName = null;
          }
        }, 300);
      });

      tooltipEl.addEventListener('mouseenter', () => {
        isOverBox = true;
        clearTimeout(hideTimer);
      });

      tooltipEl.addEventListener('mouseleave', () => {
        isOverBox = false;
        tooltipEl.style.display = 'none';
        currentHoverName = null;
      });
    }

    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
