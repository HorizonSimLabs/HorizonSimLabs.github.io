<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorizonSimLabs - 飞机功能</title>
    <link rel="icon" href="/HorizonSimLabs.png" type="image/png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh; background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 30px 20px;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 1200px; margin: 0 auto 30px auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px;
        }
        h2 { font-size: 2rem; color: #e2e8f0; }
        .back-link {
            color: #94a3b8; text-decoration: none; font-size: 0.9rem;
            padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; transition: 0.3s;
        }
        .back-link:hover { color: #fff; background: rgba(255,255,255,0.1); }

        .filter-bar {
            max-width: 1200px; margin: 0 auto 30px auto;
            display: flex; gap: 20px; flex-wrap: wrap;
            background: rgba(30, 41, 59, 0.6); padding: 15px 20px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; }
        .filter-group select {
            background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; padding: 10px; font-size: 0.95rem; outline: none; cursor: pointer; transition: 0.3s;
        }
        .filter-group select:focus { border-color: #10b981; }

        .skin-grid {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
        }
        .skin-card {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column;
        }
        .skin-card:hover { transform: translateY(-5px); border-color: #10b981; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2); }
        .card-image { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
        .card-content { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 10px; line-height: 1.4; }
        .card-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .card-info span { color: #cbd5e1; font-weight: 500; }
        
        /* 按钮组 */
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .download-btn {
            flex: 1; text-align: center; padding: 10px;
            background: #10b981; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; transition: background 0.3s;
        }
        .download-btn:hover { background: #059669; }
        .desc-btn {
            flex: 1; text-align: center; padding: 10px; border: 1px solid #3b82f6; background: transparent;
            color: #3b82f6; text-decoration: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .desc-btn:hover { background: #3b82f6; color: #fff; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px; color: #94a3b8; font-size: 1.1rem; }

        /* ★ 详情弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; width: 90%; max-width: 500px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-title { font-size: 1.3rem; font-weight: bold; color: #10b981; margin-bottom: 15px; padding-right: 20px; }
        .modal-desc { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; max-height: 50vh; overflow-y: auto; }
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .close-btn:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h2>飞机功能插件</h2>
        <a href="../plane.html" class="back-link">← 返回飞机分类</a>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>机型 (Aircraft)</label>
            <select id="filter-aircraft"><option value="all">全部机型</option></select>
        </div>
        <div class="filter-group">
            <label>作者 (Author)</label>
            <select id="filter-author"><option value="all">全部作者</option></select>
        </div>
    </div>

    <div class="skin-grid" id="skin-list">
        <div class="empty-state">正在加载功能数据...</div>
    </div>

    <!-- 弹窗结构 -->
    <div class="modal-overlay" id="desc-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDesc()">×</button>
            <div class="modal-title" id="modal-title">功能介绍</div>
            <div class="modal-desc" id="modal-desc"></div>
        </div>
    </div>

    <script>
        let allSkins = [];
        const modalOverlay = document.getElementById('desc-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        // 关闭弹窗函数
        function closeDesc() {
            modalOverlay.style.display = 'none';
        }

        // 点击遮罩层关闭弹窗
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeDesc();
        });

        // 打开弹窗函数
        function openDesc(name, desc) {
            if (!desc || desc.trim() === '') {
                alert('该插件暂无详细介绍。');
                return;
            }
            modalTitle.innerText = name;
            modalDesc.innerText = desc; // 使用 innerText 防止 XSS，同时保留换行
            modalOverlay.style.display = 'flex';
        }

        async function init() {
            try {
                const res = await fetch('./function.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('找不到 function.json');
                allSkins = await res.json();
                if (!Array.isArray(allSkins)) throw new Error('必须是数组');
                
                populateFilters(allSkins);
                renderCards(allSkins);
                bindFilterEvents();
            } catch (e) {
                console.error(e);
                document.getElementById('skin-list').innerHTML = `<div class="empty-state" style="color:#f87171;">加载失败！请确保存在 function.json 且格式正确。</div>`;
            }
        }

        function populateFilters(data) {
            const aircrafts = [...new Set(data.map(item => item.aircraft))].filter(Boolean);
            const authors = [...new Set(data.map(item => item.author))].filter(Boolean);
            const selAircraft = document.getElementById('filter-aircraft');
            const selAuthor = document.getElementById('filter-author');
            aircrafts.forEach(val => selAircraft.innerHTML += `<option value="${val}">${val}</option>`);
            authors.forEach(val => selAuthor.innerHTML += `<option value="${val}">${val}</option>`);
        }

        function renderCards(data) {
            const listEl = document.getElementById('skin-list');
            if (data.length === 0) {
                listEl.innerHTML = '<div class="empty-state">没有找到符合条件的功能。</div>';
                return;
            }
            let html = '';
            data.forEach(item => {
                // 判断是否有介绍，没有就隐藏按钮
                const hasDesc = item.description && item.description.trim() !== '';
                const descBtnHtml = hasDesc 
                    ? `<button class="desc-btn" onclick="openDesc('${item.name.replace(/'/g, "\\'")}', '${item.description.replace(/'/g, "\\'").replace(/\n/g, "\\n")}')">查看介绍</button>` 
                    : '';

                html += `
                    <div class="skin-card">
                        ${item.image ? `<img src="${item.image}" class="card-image" alt="${item.name}">` : `<div class="card-image"></div>`}
                        <div class="card-content">
                            <div class="card-title">${item.name || '未命名功能'}</div>
                            <div class="card-info">
                                <div>机型：<span>${item.aircraft || '未知'}</span></div>
                                <div>作者：<span>${item.author || '未知'}</span></div>
                            </div>
                            <div class="btn-group">
                                ${item.link ? `<a href="${item.link}" target="_blank" class="download-btn">点击下载</a>` : `<a href="javascript:void(0)" class="download-btn" style="background:#475569;cursor:not-allowed;">暂无链接</a>`}
                                ${descBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function bindFilterEvents() {
            const selAircraft = document.getElementById('filter-aircraft');
            const selAuthor = document.getElementById('filter-author');
            function applyFilters() {
                const a = selAircraft.value;
                const u = selAuthor.value;
                const filtered = allSkins.filter(item => {
                    return (a === 'all' || item.aircraft === a) && (u === 'all' || item.author === u);
                });
                renderCards(filtered);
            }
            selAircraft.addEventListener('change', applyFilters);
            selAuthor.addEventListener('change', applyFilters);
        }

        init();
    </script>
</body>
</html>
